[project]
name = "python-mastery-course"
version = "1.0.0"
description = "A self-paced, hands-on Python mastery course. Study it in VS Code with Claude Code as your instructor."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.165.10",
]
frameworks = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
norecursedirs = [".verify", "playground", "solutions", "system-prompt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
